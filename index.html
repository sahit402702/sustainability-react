<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/cognizant-favicon.ico?v=2" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes"
    />
    <meta name="theme-color" content="#047857" />

    <!-- Preconnect to external resources for faster DNS resolution -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Optimized Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=optional"
      rel="stylesheet"
    />

    <!-- Preload critical images to reduce LCP -->
    <link
      rel="preload"
      href="/assets/birkbeck_logo.svg"
      as="image"
      type="image/svg+xml"
    />
    <link
      rel="preload"
      href="/assets/cognizant_logo.svg"
      as="image"
      type="image/svg+xml"
    />

    <!-- Primary Meta Tags -->
    <title>SME NetZero Hub - Environmental Reporting & Impact Tracking</title>
    <meta
      name="description"
      content="Leading sustainability platform providing transparent environmental reporting, carbon footprint tracking, and measurable impact data. Access comprehensive sustainability reports and join our mission for a greener future."
    />
    <meta
      name="keywords"
      content="sustainability, environmental reporting, carbon footprint, ESG reporting, climate action, green initiatives, sustainability reports, environmental impact, carbon neutral, renewable energy, SME, net zero"
    />
    <meta name="author" content="SME NetZero Hub" />
    <meta name="robots" content="index, follow" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://www.netzerosmehub.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.netzerosmehub.com/" />
    <meta
      property="og:title"
      content="SME NetZero Hub - Environmental Reporting & Impact Tracking"
    />
    <meta
      property="og:description"
      content="Leading sustainability platform providing transparent environmental reporting, carbon footprint tracking, and measurable impact data."
    />
    <meta
      property="og:image"
      content="https://www.netzerosmehub.com/og-image.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="SME NetZero Hub" />
    <meta property="og:locale" content="en_US" />

    <!-- Mobile App Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="SME NetZero Hub" />
    <meta name="application-name" content="SME NetZero Hub" />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "SME NetZero Hub",
        "url": "https://www.netzerosmehub.com",
        "logo": "https://www.netzerosmehub.com/assets/cognizant_logo.svg",
        "description": "Leading sustainability platform providing transparent environmental reporting and impact tracking for SMEs"
      }
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "SME NetZero Hub",
        "url": "https://www.netzerosmehub.com",
        "description": "Environmental reporting and sustainability impact tracking platform for SMEs"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
