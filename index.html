<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Use local Cognizant favicon to avoid third-party cookies -->
    <link
      rel="icon"
      type="image/x-icon"
      href="/cognizant-favicon.ico?v=2"
    />
    
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes"
    />
    <meta name="theme-color" content="#047857" />

    <!-- Preconnect to external resources for faster DNS resolution -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Optimized Google Fonts - Using display=optional to prevent layout shift -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=optional"
      rel="stylesheet"
    />
    
    <!-- Preload critical images to reduce LCP -->
    <link rel="preload" href="/assets/birkbeck_logo.svg" as="image" type="image/svg+xml" />
    <link rel="preload" href="/assets/cognizant_logo.svg" as="image" type="image/svg+xml" />

    <!-- Primary Meta Tags -->
    <title>SME NetZero Hub</title>
    <meta
      name="title"
      content="Sustainability Portal - Environmental Reporting & Impact Tracking"
    />
    <meta
      name="description"
      content="Leading sustainability platform providing transparent environmental reporting, carbon footprint tracking, and measurable impact data. Access comprehensive sustainability reports, case studies, and join our mission for a greener future."
    />
    <meta
      name="keywords"
      content="sustainability, environmental reporting, carbon footprint, ESG reporting, climate action, green initiatives, sustainability reports, environmental impact, carbon neutral, renewable energy, case studies"
    />
    <meta name="author" content="Sustainability Portal" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="English" />
    <meta name="revisit-after" content="7 days" />

    <!-- Canonical URL - Update with your actual domain before deployment -->
    <!-- <link rel="canonical" href="https://your-actual-domain.com/" /> -->

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <!-- Update with your actual domain before deployment -->
    <!-- <meta property="og:url" content="https://your-actual-domain.com/" /> -->
    <meta
      property="og:title"
      content="Sustainability Portal - Environmental Reporting & Impact Tracking"
    />
    <meta
      property="og:description"
      content="Leading sustainability platform providing transparent environmental reporting, carbon footprint tracking, and measurable impact data."
    />
    <!-- Update with your actual domain and image before deployment -->
    <!-- <meta property="og:image" content="https://your-actual-domain.com/og-image.jpg" /> -->
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Sustainability Portal" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Update with your actual domain before deployment -->
    <!-- <meta name="twitter:url" content="https://your-actual-domain.com/" /> -->
    <meta
      name="twitter:title"
      content="Sustainability Portal - Environmental Reporting & Impact Tracking"
    />
    <meta
      name="twitter:description"
      content="Leading sustainability platform providing transparent environmental reporting, carbon footprint tracking, and measurable impact data."
    />
    <!-- Update with your actual domain and image before deployment -->
    <!-- <meta name="twitter:image" content="https://your-actual-domain.com/twitter-image.jpg" /> -->
    <meta name="twitter:creator" content="@sustainabilityportal" />

    <!-- Additional SEO Meta Tags -->
    <meta name="theme-color" content="#2C5F2D" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Sustainability Portal" />
    <meta name="application-name" content="Sustainability Portal" />
    <meta name="msapplication-TileColor" content="#2C5F2D" />
    <meta name="msapplication-config" content="/browserconfig.xml" />

    <!-- Geo Tags (if location-specific) -->
    <meta name="geo.region" content="US" />
    <meta name="geo.placename" content="United States" />
