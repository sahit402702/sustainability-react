<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2C5F2D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A8B4D;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#greenGradient)"/>
  
  <!-- Leaf design -->
  <path d="M 30 50 Q 30 30, 50 30 Q 70 30, 70 50 Q 70 60, 50 70 Q 30 60, 30 50" 
        fill="#ffffff" opacity="0.9"/>
  
  <!-- Stem -->
  <path d="M 50 50 L 50 70" stroke="#ffffff" stroke-width="3" opacity="0.9"/>
  
  <!-- Vein lines -->
  <path d="M 50 35 L 50 55" stroke="#2C5F2D" stroke-width="1.5" opacity="0.5"/>
  <path d="M 42 42 L 50 47" stroke="#2C5F2D" stroke-width="1" opacity="0.5"/>
  <path d="M 58 42 L 50 47" stroke="#2C5F2D" stroke-width="1" opacity="0.5"/>
